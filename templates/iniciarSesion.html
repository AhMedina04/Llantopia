<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Llantopía</title>
    <style>
        :root {
            --color-bg: #FFF3A0; --color-yellow: #FFD700; --color-slate: #4A4E57;
            --color-dark: #2A2D32; --color-red: #9E2A2B; --color-blue: #4CC9F0; --color-white: #FFFFFF;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: var(--color-bg); color: var(--color-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        .logo-img { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; margin-bottom: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); border: 2px solid var(--color-yellow); }
        h2 { color: var(--color-slate); margin-top: 0; margin-bottom: 20px; font-size: 20px; }
        
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13px; color: var(--color-dark); text-align: left; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; font-size: 13px; }
        
        .btn-enviar { background-color: var(--color-blue); color: var(--color-dark); border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 5px; }
        .btn-enviar:hover { opacity: 0.9; }
        
        .link-secundario { display: block; text-align: center; margin-top: 15px; color: var(--color-slate); text-decoration: none; font-size: 13px; font-weight: bold; }
        .link-secundario:hover { text-decoration: underline; }

        .flash-mensaje { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; font-size: 12px; margin-bottom: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo Llantopía" class="logo-img">
        <h2>Iniciar Sesión en Llantopía</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-mensaje">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="/iniciarSesion" method="POST" style="text-align: left;">
            <label>Correo Electrónico:</label>
            <input type="email" name="correo" required>

            <label>Contraseña:</label>
            <div style="position: relative; margin-bottom: 15px;">
                <input type="password" name="contrasena" id="input-contrasena-login" required style="width: 100%; padding: 10px; padding-right: 40px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 13px; margin-bottom: 0;">
                <button type="button" onclick="togglePassword('input-contrasena-login', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px;" title="Ver contraseña">👁️</button>
            </div>

            <button type="submit" class="btn-enviar">Entrar</button>
        </form>

        <a href="{{ url_for('registro') }}" class="link-secundario">¿No tienes cuenta? Regístrate aquí</a>
    </div>

    <script>
        function togglePassword(idInput, btn) {
            const input = document.getElementById(idInput);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
