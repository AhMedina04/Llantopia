<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leyendo: {{ libro.titulo }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --color-bg: #FFF3A0; --color-yellow: #FFD700; --color-slate: #4A4E57;
            --color-dark: #2A2D32; --color-red: #9E2A2B; --color-blue: #4CC9F0; --color-white: #FFFFFF;
        }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--color-dark); font-family: 'Segoe UI', Arial, sans-serif; display: flex; flex-direction: column; }
        .top-bar { background: var(--color-yellow); color: var(--color-dark); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; height: 40px; flex-shrink: 0; font-weight: bold; }
        .top-bar a { color: var(--color-dark); text-decoration: none; }
        .top-bar a:hover { text-decoration: underline; }
        
        .pdf-controls { background: #1a1a1a; color: white; padding: 8px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-shrink: 0; border-bottom: 1px solid #333; }
        .pdf-controls button { background: var(--color-blue); color: var(--color-dark); border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .pdf-controls button:hover { opacity: 0.9; }
        .pdf-controls span { font-size: 14px; }

        .viewer-container { flex-grow: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; background: #333; }
        canvas { box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 100%; height: auto; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>📖 <strong>{{ libro.titulo }}</strong> — Autor: {{ libro.autor }}</span>
        <a href="{{ url_for('pagina_principal') }}">⬅️ Volver a la Biblioteca</a>
    </div>

    <div class="pdf-controls">
        <button id="prev-page">◀ Anterior</button>
        <span>Página: <span id="page-num"></span> / <span id="page-count"></span></span>
        <button id="next-page">Siguiente ▶</button>
    </div>

    <div class="viewer-container">
        <canvas id="pdf-render"></canvas>
    </div>

    <script>
        const archivoRuta = "{{ libro.archivo }}";
        const urlPdf = archivoRuta.startsWith('http') ? archivoRuta : "{{ url_for('static', filename='uploads/') }}" + archivoRuta;
        
        const usuarioActual = "{{ session.get('usuario_id', 'invitado') }}";
        const storageKeyPdf = 'libro_pagina_' + usuarioActual + '_' + "{{ libro.id }}";

        let pdfDoc = null,
            pageNum = parseInt(localStorage.getItem(storageKeyPdf)) || 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.3,
            canvas = document.getElementById('pdf-render'),
            ctx = canvas.getContext('2d');

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                let viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                let renderContext = { canvasContext: ctx, viewport: viewport };
                let renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('page-num').textContent = num;
            localStorage.setItem(storageKeyPdf, num);
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        document.getElementById('prev-page').addEventListener('click', function() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        });

        document.getElementById('next-page').addEventListener('click', function() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        });

        pdfjsLib.getDocument(urlPdf).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            document.getElementById('page-count').textContent = pdfDoc.numPages;

            if (pageNum > pdfDoc.numPages) {
                pageNum = 1;
            }

            renderPage(pageNum);
        }).catch(function(error) {
            console.error('Error al cargar el PDF:', error);
            document.querySelector('.viewer-container').innerHTML = `
                <div style="color: #ff6b6b; text-align: center; padding: 30px; font-weight: bold; background: #222; border-radius: 8px; border: 1px solid #444;">
                    ⚠️ No se pudo cargar el archivo PDF desde la nube.<br><br>
                    <small style="color: #aaa; font-weight: normal;">URL intentada: ${urlPdf}</small><br>
                    <small style="color: #ff8787; font-weight: normal;">Detalle técnico: ${error.message || error}</small>
                </div>`;
        });
    </script>
</body>
</html>
