<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Llantopía</title>
    <style>
        :root {
            --color-bg: #FFF3A0; --color-yellow: #FFD700; --color-slate: #4A4E57;
            --color-dark: #2A2D32; --color-red: #9E2A2B; --color-blue: #4CC9F0; --color-white: #FFFFFF;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; margin: 0; background-color: var(--color-bg); color: var(--color-dark); display: flex; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
        .container { background: var(--color-white); padding: 40px; border-radius: 15px; box-shadow: 0px 6px 20px rgba(0,0,0,0.08); max-width: 450px; width: 90%; }
        h1 { color: var(--color-slate); font-size: 24px; margin-top: 0; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: inline-block; width: 100%; padding: 12px; margin: 8px 0; text-decoration: none; border-radius: 8px; font-weight: bold; box-sizing: border-box; font-size: 15px; text-align: center; }
        .btn-invitado { background-color: var(--color-slate); color: var(--color-white); }
        .btn-registro { background-color: var(--color-blue); color: var(--color-dark); }
        .btn-login { background-color: var(--color-yellow); color: var(--color-dark); }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 ¡Bienvenido a Llantopía! 📖</h1>
        <p>Explora nuestro catálogo, descubre categorías o regístrate para acceder a todas las funciones interactivas.</p>
        <a href="{{ url_for('invitado') }}" class="btn btn-invitado">Entrar como Invitado</a>
        <a href="{{ url_for('iniciarSesion') }}" class="btn btn-login">Iniciar Sesión</a>
        <a href="{{ url_for('registro') }}" class="btn btn-registro">Registrarse</a>
    </div>
</body>
</html>
